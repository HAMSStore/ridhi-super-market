<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ridhi Super Market</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#222}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.top{position:sticky;top:0;z-index:100;background:#fff;box-shadow:0 1px 8px rgba(0,0,0,.08)}.nav{background:linear-gradient(90deg,#5b006f,#780090);color:#fff}.navin{max-width:1280px;margin:auto;padding:10px 18px;display:flex;align-items:center;gap:16px}.logo{font-size:28px;font-weight:900;letter-spacing:-1.5px}.divider{height:28px;width:1px;background:rgba(255,255,255,.35)}.loc{font-size:12px;white-space:nowrap}.loc b{display:block;font-size:13px}.search{flex:1;position:relative}.search input{width:100%;height:44px;border:0;border-radius:7px;padding:0 15px 0 40px;outline:0}.search span{position:absolute;left:14px;top:9px;color:#777;font-size:21px}.account{border:0;background:transparent;color:#fff;font-weight:700}.cart{position:relative;border:0;background:#ff2f78;color:#fff;font-weight:800;border-radius:7px;padding:12px 18px}.count{position:absolute;right:-7px;top:-7px;background:#111;color:#fff;width:21px;height:21px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px}.userbar{max-width:1280px;margin:auto;display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:7px 18px;font-size:12px}.userbar img{width:28px;height:28px;border-radius:50%;object-fit:cover}.userbar button{border:1px solid #ddd;background:#fff;border-radius:6px;padding:5px 9px}
.page{max-width:1280px;margin:auto;padding:0 18px}.head{display:flex;justify-content:space-between;align-items:center;margin:17px 2px 9px}.head h2{font-size:18px;margin:0}.see{font-size:13px;color:#d22b6b;font-weight:700}.feature{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:10px;overflow-x:auto;padding:2px 1px 9px}.fcard{border:1px solid #eee;border-radius:5px;padding:8px;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.08)}.fimg{height:112px;display:flex;align-items:center;justify-content:center}.fimg img{width:100%;height:100%;object-fit:contain}.fname{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:7px}.funit{font-size:11px;color:#777;margin-top:4px}.fprice{font-weight:900;margin-top:6px}.mini{float:right;margin-top:-25px;border:1px solid #e4a0bc;color:#d02d6b;background:#fff;border-radius:5px;padding:5px 8px;font-weight:800}
.cats{display:grid;grid-auto-flow:column;grid-auto-columns:175px;gap:12px;overflow-x:auto;padding:2px 2px 12px}.cat{height:112px;border:0;border-radius:16px;overflow:hidden;position:relative;background:#f1e7ff;padding:0}.cat img{width:100%;height:100%;object-fit:cover}.cat:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.7))}.cat span{position:absolute;z-index:2;left:10px;bottom:9px;color:#fff;font-weight:800;text-shadow:0 1px 3px #000}
.products{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;padding-bottom:35px}.card{position:relative;border:1px solid #eee;border-radius:7px;overflow:hidden;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.06)}.discount{position:absolute;left:0;top:0;background:#7c008f;color:#fff;font-size:10px;padding:5px 7px;border-radius:0 0 5px 0;font-weight:800}.pimg{height:175px;display:flex;align-items:center;justify-content:center;padding:12px}.pimg img{width:100%;height:100%;object-fit:contain}.body{padding:10px}.pname{font-size:14px;font-weight:700;line-height:1.25;height:36px;overflow:hidden}.unit{font-size:11px;color:#777;margin-top:5px;height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prices{display:flex;gap:7px;align-items:center;margin-top:7px}.price{font-size:15px;font-weight:900}.mrp{text-decoration:line-through;color:#999;font-size:11px}.add{width:100%;margin-top:9px;border:1px solid #d88aaa;background:#fff;color:#d02d6b;border-radius:5px;padding:8px;font-weight:800}.add:hover{background:#fff3f7}.unavailable{font-size:11px;color:#999;margin-top:10px}
.login{min-height:100vh;background:#f7f7f8;display:flex;align-items:center;justify-content:center;padding:20px}.loginbox{width:min(430px,100%);background:#fff;border-radius:16px;padding:32px;box-shadow:0 8px 35px rgba(0,0,0,.12);text-align:center}.loginbox h1{margin:0 0 8px}.loginbox p{color:#666}.google{display:flex;justify-content:center;margin:25px 0}.msg{padding:12px;border-radius:8px;text-align:left;font-size:13px}.error{background:#ffebee}.success{background:#e8f5e9}
.qoverlay{position:fixed;inset:0;z-index:450;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:18px}.qmodal{position:relative;width:min(420px,100%);background:#fff;border-radius:18px;padding:20px;box-shadow:0 12px 45px rgba(0,0,0,.25);text-align:center}.qclose{position:absolute;right:12px;top:12px;border:0;background:#f1f1f1;border-radius:50%;width:30px;height:30px}.qimage{height:150px;display:flex;align-items:center;justify-content:center}.qimage img{max-width:100%;max-height:100%;object-fit:contain}.qname{margin:8px 35px 4px;font-size:18px}.qprice{font-weight:900;font-size:17px}.qhint{color:#777;font-size:12px;margin-top:14px}.qcontrols{display:flex;justify-content:center;align-items:center;gap:20px;margin:10px 0 16px}.qcontrols button{width:38px;height:38px;border:1px solid #ddd;background:#fff;border-radius:9px;font-size:22px}.qcontrols strong{min-width:25px;font-size:18px}.qadd{width:100%;border:0;background:#111;color:#fff;border-radius:9px;padding:13px;font-weight:800}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:200}.drawer{position:fixed;right:0;top:0;height:100%;width:min(440px,100%);background:#fff;z-index:210;display:flex;flex-direction:column}.dhead{padding:17px;border-bottom:1px solid #eee;display:flex;justify-content:space-between}.dhead button{border:0;background:#eee;border-radius:7px;padding:7px 10px}.ditems{flex:1;overflow:auto;padding:12px 17px}.ditem{border-bottom:1px solid #eee;padding:12px 0}.dname{font-weight:700}.dprice{font-size:13px;color:#555;margin-top:4px}.qty{display:flex;align-items:center;gap:10px;margin-top:8px}.qty button{width:29px;height:29px;border:1px solid #ddd;background:#fff;border-radius:6px}.dfoot{padding:17px;border-top:1px solid #eee}.total{display:flex;justify-content:space-between;font-size:19px;font-weight:900}.checkout{width:100%;margin-top:12px;background:#111;color:#fff;border:0;border-radius:8px;padding:13px}
.fly{position:fixed;z-index:500;width:56px;height:56px;border-radius:12px;background:#fff;box-shadow:0 7px 25px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden;transition:transform .72s cubic-bezier(.2,.85,.25,1),opacity .72s ease}.fly img{width:100%;height:100%;object-fit:contain}.toast{position:fixed;z-index:600;left:50%;bottom:22px;transform:translateX(-50%);background:#111;color:#fff;border-radius:8px;padding:10px 15px;font-size:13px}
@media(max-width:1050px){.products{grid-template-columns:repeat(4,1fr)}}@media(max-width:780px){.navin{flex-wrap:wrap;padding:9px 12px}.loc,.divider,.account{display:none}.search{order:5;flex-basis:100%}.products{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.page{padding:0 10px}.products{grid-template-columns:repeat(2,1fr);gap:9px}.pimg{height:145px}.feature{grid-auto-columns:145px}.cats{grid-auto-columns:135px}.cat{height:96px}}
</style>
</head>
<body>
<section id="loginScreen" class="login"><div class="loginbox"><h1>Ridhi Super Market</h1><p>Sign in to shop groceries online</p><div id="googleSignInButton" class="google"></div><div id="loginMsg" class="msg">Please sign in with Google.</div></div></section>
<section id="app" class="hidden">
<header class="top"><div class="nav"><div class="navin"><div class="logo">ridhi</div><div class="divider"></div><div class="loc">Delivering to<b>Nallasopara West⌄</b></div><div class="search"><span>⌕</span><input id="search" placeholder="Search for products, brands or SKU"></div><button class="account" onclick="scrollToTop()">Account</button><button id="cartButton" class="cart">🛍 My Cart <span id="cartCount" class="count">0</span></button></div></div><div id="userbar" class="userbar"></div></header>
<main class="page"><section><div class="head"><h2>Products for you</h2><span class="see">See All ›</span></div><div id="featured" class="feature"></div></section><section><div class="head"><h2>Explore By Categories</h2><span class="see">See All ›</span></div><div id="categories" class="cats"></div></section><section><div class="head"><h2 id="productTitle">All Products</h2></div><div id="products" class="products"></div></section></main></section>
<div id="quantityOverlay" class="qoverlay hidden"><div class="qmodal"><button class="qclose" onclick="closeQuantityPicker()">✕</button><div id="qimage" class="qimage"></div><h3 id="qname" class="qname">Product</h3><div id="qprice" class="qprice">₹0</div><div class="qhint">Select quantity</div><div class="qcontrols"><button onclick="adjustPendingQty(-1)">−</button><strong id="qvalue">1</strong><button onclick="adjustPendingQty(1)">+</button></div><button class="qadd" onclick="confirmQuantity()">Add to Cart</button></div></div>
<div id="overlay" class="overlay hidden"></div><aside id="drawer" class="drawer hidden"><div class="dhead"><h2 style="margin:0">My Cart</h2><button id="closeCart">✕</button></div><div id="cartItems" class="ditems"></div><div class="dfoot"><div class="total"><span>Total</span><span id="cartTotal">₹0</span></div><button class="checkout" onclick="alert('Checkout will be connected in the next stage.')">Continue to Checkout</button></div></aside>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbywn4Lfap2OZzdeScBFHvthoT5yd-fGC69glIjvE69mQvwW9S5u9xmegLFPA7kwv9URtQ/exec";
const GOOGLE_CLIENT_ID="326159645063-jmbghp2v7qu8c9ik67bq6mmbcn3u44mp.apps.googleusercontent.com";
const SESSION_KEY="ridhiCustomerSession",PROFILE_KEY="ridhiCustomerProfile",ACTIVITY_KEY="ridhiLastActivity",DAY=86400000;
let sessionToken=localStorage.getItem(SESSION_KEY)||null,customer=readJson(localStorage.getItem(PROFILE_KEY))||null,allProducts=[],allCategories=[],selectedCategory="",searchTerm="",cart=readJson(localStorage.getItem("ridhiCart"))||{},refreshTimer=null,refreshBusy=false,lastRefresh=0,pendingProduct=null,pendingQty=1;
function readJson(v){try{return v?JSON.parse(v):null}catch(e){return null}}
async function apiPost(action,payload={}){const r=await fetch(API_URL,{method:"POST",cache:"no-store",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,...payload})});if(!r.ok)throw new Error("Ridhi backend request failed. HTTP "+r.status);const d=await r.json();if(!d.success){const e=new Error(d.error||d.message||"Request failed.");e.code=d.code;throw e}return d.data||{}}
async function publicGet(action,params={}){const u=new URL(API_URL);u.searchParams.set("action",action);Object.entries(params).forEach(([k,v])=>{if(v!==undefined&&v!==null&&v!=="")u.searchParams.set(k,v)});const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw new Error("Ridhi API request failed. HTTP "+r.status);const d=await r.json();if(!d.success)throw new Error(d.error||"Request failed.");return d.data||{}}
function saveProfile(){localStorage.setItem(PROFILE_KEY,JSON.stringify(customer||{}))}
function sessionFresh(){const last=Number(localStorage.getItem(ACTIVITY_KEY)||0);return !!sessionToken&&last>0&&(Date.now()-last)<DAY}
async function refreshSession(){if(!sessionToken||refreshBusy)return false;refreshBusy=true;try{const d=await apiPost("refreshCustomerSession",{sessionToken});sessionToken=d.sessionToken;customer=d.customer||customer;localStorage.setItem(SESSION_KEY,sessionToken);localStorage.setItem(ACTIVITY_KEY,String(Date.now()));saveProfile();lastRefresh=Date.now();return true}catch(e){forceLogin();return false}finally{refreshBusy=false}}
function markActivity(){if(!sessionToken)return;localStorage.setItem(ACTIVITY_KEY,String(Date.now()));if(Date.now()-lastRefresh>5*60*1000&&!refreshTimer){refreshTimer=setTimeout(async()=>{refreshTimer=null;await refreshSession()},700)}}
function forceLogin(){sessionToken=null;customer=null;localStorage.removeItem(SESSION_KEY);localStorage.removeItem(PROFILE_KEY);localStorage.removeItem(ACTIVITY_KEY);document.getElementById("app").classList.add("hidden");document.getElementById("loginScreen").classList.remove("hidden");const m=document.getElementById("loginMsg");m.className="msg error";m.textContent="Your 24-hour session has expired. Please sign in again."}
function setupGoogle(){if(!window.google||!google.accounts?.id){setTimeout(setupGoogle,400);return}google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:googleCallback,auto_select:false,cancel_on_tap_outside:true,use_fedcm_for_prompt:true});google.accounts.id.renderButton(document.getElementById("googleSignInButton"),{theme:"outline",size:"large",type:"standard",text:"signin_with",shape:"rectangular",width:280,logo_alignment:"left"})}
async function googleCallback(response){const m=document.getElementById("loginMsg");m.className="msg";m.textContent="Signing you in...";try{const d=await apiPost("verifyCustomerGoogle",{idToken:response.credential});sessionToken=d.sessionToken;customer=d.customer||{};localStorage.setItem(SESSION_KEY,sessionToken);localStorage.setItem(ACTIVITY_KEY,String(Date.now()));saveProfile();await showApp()}catch(e){m.className="msg error";m.textContent=e.message}}
async function showApp(){document.getElementById("loginScreen").classList.add("hidden");document.getElementById("app").classList.remove("hidden");renderUser();renderCart();if(!(await refreshSession()))return;try{await loadStore()}catch(e){document.getElementById("products").innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:#777">'+esc(e.message)+'</div>'}}
async function start(){if(sessionFresh()){document.getElementById("loginScreen").classList.add("hidden");document.getElementById("app").classList.remove("hidden");renderUser();renderCart();if(await refreshSession())await loadStore()}else if(sessionToken)forceLogin()}
function renderUser(){const e=document.getElementById("userbar"),n=customer?.name||customer?.FULL_NAME||"Customer",mail=customer?.email||customer?.GOOGLE_EMAIL||"",pic=customer?.picture||customer?.PROFILE_IMAGE||"";e.innerHTML=(pic?`<img src="${attr(pic)}" alt="">`:"")+`<span>Hi, <b>${esc(n)}</b>${mail?" · "+esc(mail):""}</span><button onclick="logout()">Sign out</button>`}
async function loadStore(){const [c,p,f]=await Promise.all([publicGet("categories"),publicGet("products"),publicGet("products",{featured:"true"})]);allCategories=c.categories||[];allProducts=p.products||[];renderCategories();renderFeatured(f.products||[]);renderProducts()}
function renderFeatured(list){const e=document.getElementById("featured");if(!list.length)list=allProducts.slice(0,10);e.innerHTML=list.slice(0,10).map(p=>{const n=p.productName||p.name||"Product";return `<article class="fcard"><div class="fimg">${p.image?`<img src="${attr(p.image)}" alt="${attr(n)}" loading="lazy">`:"🛍️"}</div><div class="fname">${esc(n)}</div><div class="funit">${esc(p.packSize||p.unit||"")}</div><div class="fprice">₹${money(p.price)}</div><button class="mini" onclick="addToCart('${js(p.productId)}',this)">Add</button></article>`}).join("")}
function renderCategories(){document.getElementById("categories").innerHTML=allCategories.map(c=>`<button class="cat" onclick="chooseCategory('${js(c.categoryId)}')">${c.image?`<img src="${attr(c.image)}" alt="${attr(c.name)}" loading="lazy">`:""}<span>${esc(c.name||"Category")}</span></button>`).join("")}
function chooseCategory(id){selectedCategory=String(id||"");const c=allCategories.find(x=>String(x.categoryId)===selectedCategory);document.getElementById("productTitle").textContent=c?c.name:"All Products";renderProducts();window.scrollTo({top:document.getElementById("products").offsetTop-90,behavior:"smooth"});markActivity()}
function filteredProducts(){const q=searchTerm.trim().toLowerCase();return allProducts.filter(p=>{if(selectedCategory&&String(p.categoryId||"")!==selectedCategory)return false;if(!q)return true;return [p.productId,p.productName,p.name,p.brand,p.sku,p.category,p.searchKeywords].join(" ").toLowerCase().includes(q)})}
function renderProducts(){const e=document.getElementById("products"),list=filteredProducts();if(!list.length){e.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:#777">No products found.</div>';return}e.innerHTML=list.map(p=>{const n=p.productName||p.name||"Product",price=Number(p.price||0),mrp=Number(p.mrp||0),disc=mrp>price?Math.round((1-price/mrp)*100):0;return `<article class="card">${disc?`<div class="discount">${disc}% OFF</div>`:""}<div class="pimg">${p.image?`<img src="${attr(p.image)}" alt="${attr(n)}" loading="lazy">`:"🛍️"}</div><div class="body"><div class="pname">${esc(n)}</div><div class="unit">${esc(p.packSize||p.unit||"")}</div><div class="prices"><span class="price">₹${money(price)}</span>${mrp>price?`<span class="mrp">₹${money(mrp)}</span>`:""}</div>${p.available?`<button class="add" onclick="addToCart('${js(p.productId)}',this)">Add</button>`:`<div class="unavailable">Currently unavailable</div>`}</div></article>`}).join("")}
function addToCart(id,source){const p=allProducts.find(x=>String(x.productId)===String(id));if(!p||!p.available)return;pendingProduct=p;pendingQty=1;flyToCart(source,p.image,()=>openQuantityPicker(p));markActivity()}
function openQuantityPicker(p){document.getElementById("qname").textContent=p.productName||p.name||"Product";document.getElementById("qprice").textContent="₹"+money(p.price)+(p.packSize||p.unit?" • "+(p.packSize||p.unit):"");document.getElementById("qvalue").textContent=pendingQty;document.getElementById("qimage").innerHTML=p.image?`<img src="${attr(p.image)}" alt="">`:"🛍️";document.getElementById("quantityOverlay").classList.remove("hidden")}
function closeQuantityPicker(){document.getElementById("quantityOverlay").classList.add("hidden");pendingProduct=null;pendingQty=1}
function adjustPendingQty(delta){pendingQty=Math.max(1,Math.min(100,pendingQty+delta));document.getElementById("qvalue").textContent=pendingQty}
function confirmQuantity(){if(!pendingProduct)return;const p=pendingProduct,key=String(p.productId);if(!cart[key])cart[key]={productId:key,productName:p.productName||p.name||"Product",price:Number(p.price||0),unit:p.packSize||p.unit||"",image:p.image||"",quantity:0};cart[key].quantity=Math.min(1000,cart[key].quantity+pendingQty);saveCart();renderCart();const n=p.productName||p.name||"Product",q=pendingQty;closeQuantityPicker();showToast(q+" × "+n+" added to cart");markActivity()}
function flyToCart(source,img,done){if(!source){if(done)done();return}const a=source.getBoundingClientRect(),b=document.getElementById("cartButton").getBoundingClientRect(),f=document.createElement("div");f.className="fly";f.style.left=a.left+"px";f.style.top=a.top+"px";f.innerHTML=img?`<img src="${attr(img)}" alt="">`:"🛍️";document.body.appendChild(f);requestAnimationFrame(()=>{const dx=b.left-a.left+b.width/2-28,dy=b.top-a.top+b.height/2-28;f.style.transform=`translate(${dx}px,${dy}px) scale(.25) rotate(12deg)`;f.style.opacity="0"});setTimeout(()=>{f.remove();if(done)done()},760)}
function saveCart(){localStorage.setItem("ridhiCart",JSON.stringify(cart))}
function renderCart(){const list=Object.values(cart),e=document.getElementById("cartItems");document.getElementById("cartCount").textContent=list.reduce((s,x)=>s+Number(x.quantity||0),0);e.innerHTML=list.length?list.map(x=>`<div class="ditem"><div class="dname">${esc(x.productName)}</div><div class="dprice">₹${money(x.price)} ${x.unit?"· "+esc(x.unit):""}</div><div class="qty"><button onclick="changeQty('${js(x.productId)}',-1)">−</button><b>${x.quantity}</b><button onclick="changeQty('${js(x.productId)}',1)">+</button></div></div>`).join(""):'<div style="text-align:center;color:#777;padding:40px 10px">Your cart is empty.</div>';document.getElementById("cartTotal").textContent="₹"+money(list.reduce((s,x)=>s+Number(x.price||0)*Number(x.quantity||0),0))}
function changeQty(id,d){if(!cart[id])return;cart[id].quantity+=d;if(cart[id].quantity<=0)delete cart[id];saveCart();renderCart();markActivity()}
function openCart(){document.getElementById("overlay").classList.remove("hidden");document.getElementById("drawer").classList.remove("hidden");markActivity()}function closeCart(){document.getElementById("overlay").classList.add("hidden");document.getElementById("drawer").classList.add("hidden")}
function logout(){sessionToken=null;customer=null;localStorage.removeItem(SESSION_KEY);localStorage.removeItem(PROFILE_KEY);localStorage.removeItem(ACTIVITY_KEY);try{google.accounts.id.disableAutoSelect()}catch(e){}location.reload()}function scrollToTop(){window.scrollTo({top:0,behavior:"smooth"});markActivity()}
document.getElementById("search").addEventListener("input",e=>{searchTerm=e.target.value;renderProducts();markActivity()});document.getElementById("cartButton").onclick=openCart;document.getElementById("closeCart").onclick=closeCart;document.getElementById("overlay").onclick=closeCart;document.getElementById("quantityOverlay").addEventListener("click",e=>{if(e.target.id==="quantityOverlay")closeQuantityPicker()});document.addEventListener("keydown",()=>markActivity());document.addEventListener("scroll",()=>markActivity(),{passive:true});document.addEventListener("click",()=>markActivity(),{passive:true});
function showToast(t){const x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1300)}function money(v){return Number(v||0).toLocaleString("en-IN",{maximumFractionDigits:2})}function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}function attr(v){return esc(v)}function js(v){return String(v==null?"":v).replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\r/g,"\\r").replace(/\n/g,"\\n")}
setupGoogle();start();
</script>
</body>
</html>
