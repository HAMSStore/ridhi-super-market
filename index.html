<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ridhi Super Market - Login Test</title>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client"
            async
            defer></script>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .card {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            text-align: center;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        #googleSignInButton {
            display: flex;
            justify-content: center;
            margin: 25px 0;
        }

        #result {
            margin-top: 25px;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 14px;
        }

        .success {
            padding: 15px;
            background: #e8f5e9;
            border-radius: 10px;
        }

        .error {
            padding: 15px;
            background: #ffebee;
            border-radius: 10px;
        }

        .profile {
            margin-top: 20px;
        }

        .profile img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Ridhi Super Market</h1>

    <div class="subtitle">
        Customer Login Test
    </div>

    <div id="googleSignInButton"></div>

    <div id="result">
        Please sign in with Google.
    </div>

</div>


<script>

/* ============================================================
   RIDHI CONFIGURATION
   ============================================================ */

const API_URL =
"https://script.google.com/macros/s/AKfycbywn4Lfap2OZzdeScBFHvthoT5yd-fGC69glIjvE69mQvwW9S5u9xmegLFPA7kwv9URtQ/exec";

const GOOGLE_CLIENT_ID =
"326159645063-jmbghp2v7qu8c9ik67bq6mmbcn3u44mp.apps.googleusercontent.com";


/* ============================================================
   RIDHI AUTHENTICATED API HELPER
   ============================================================ */

async function ridhiPost(action, payload = {}) {

    const idToken = window.ridhiGoogleIdToken;

    if (!idToken) {
        throw new Error("Customer session is not available. Please sign in again.");
    }

    const r = await fetch(
        API_URL,
        {
            method: "POST",
            cache: "no-store",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
                action: action,
                idToken: idToken,
                ...payload
            })
        }
    );

    if (!r.ok) {
        throw new Error(
            "Ridhi backend request failed. HTTP " + r.status
        );
    }

    const data = await r.json();

    if (!data.success) {
        throw new Error(
            data.error ||
            data.message ||
            "Ridhi API request failed."
        );
    }

    return data;
}


/* ============================================================
   INITIALIZE GOOGLE LOGIN
   ============================================================ */

function setupGoogleLogin() {

    if (
        !window.google ||
        !google.accounts ||
        !google.accounts.id
    ) {
        console.log("Google Identity Services not loaded yet.");
        setTimeout(setupGoogleLogin, 500);
        return;
    }


    google.accounts.id.initialize({

        client_id: GOOGLE_CLIENT_ID,

        callback: handleGoogleCredential,

        auto_select: false,

        cancel_on_tap_outside: true,

        use_fedcm_for_prompt: true

    });


    google.accounts.id.renderButton(

        document.getElementById("googleSignInButton"),

        {
            theme: "outline",
            size: "large",
            type: "standard",
            text: "signin_with",
            shape: "rectangular",
            width: 280,
            logo_alignment: "left"
        }

    );


    console.log("Ridhi Google Login initialized.");
}


/* ============================================================
   GOOGLE LOGIN CALLBACK
   ============================================================ */

async function handleGoogleCredential(response) {

    const result = document.getElementById("result");


    if (
        !response ||
        !response.credential
    ) {

        result.innerHTML =
            '<div class="error">Google sign-in failed.</div>';

        return;
    }


    result.innerHTML =
        "Checking your Google account...";


    try {

        /* ----------------------------------------------------
           SEND GOOGLE ID TOKEN TO RIDHI BACKEND
           Secure authenticated requests use POST.
           The ID token is sent in the request body, not the URL.
           ---------------------------------------------------- */

        console.log("Calling Ridhi backend...");

        const r = await fetch(
            API_URL,
            {
                method: "POST",
                cache: "no-store",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify({
                    action: "verifyCustomerGoogle",
                    idToken: response.credential
                })
            }
        );


        if (!r.ok) {

            throw new Error(
                "Ridhi backend request failed. HTTP " +
                r.status
            );

        }


        const data = await r.json();


        console.log(
            "Ridhi backend response:",
            data
        );


        /* ----------------------------------------------------
           BACKEND ERROR
           ---------------------------------------------------- */

        if (!data.success) {

            throw new Error(
                data.error ||
                data.message ||
                "Google account verification failed."
            );

        }


        /* ----------------------------------------------------
           LOGIN SUCCESS
           Apps Script returns:
           { success: true, data: { customer: {...} } }
           ---------------------------------------------------- */

        const payload =
            data.data || data;

        const customer =
            payload.customer || {};


        /*
         * Store the profile for this browser session.
         * Keep the Google ID token out of localStorage because it is
         * an authentication credential. The token is kept in memory
         * for the current page session and will be used by future
         * authenticated POST API calls.
         */
        window.ridhiGoogleIdToken = response.credential;

        sessionStorage.setItem(
            "ridhiCustomerProfile",
            JSON.stringify(customer)
        );


        /* ----------------------------------------------------
           DISPLAY CUSTOMER
           ---------------------------------------------------- */

        const name =
            customer.FULL_NAME ||
            customer.fullName ||
            customer.name ||
            payload.name ||
            "Customer";


        const email =
            customer.GOOGLE_EMAIL ||
            customer.googleEmail ||
            customer.email ||
            payload.email ||
            "";


        const picture =
            customer.PROFILE_IMAGE ||
            customer.profileImage ||
            customer.picture ||
            payload.picture ||
            "";


        result.innerHTML = `

            <div class="success">

                <strong>✅ Google Login Successful!</strong>

                <div class="profile">

                    ${
                        picture
                        ?
                        `<img src="${picture}"
                              alt="Profile">`
                        :
                        ""
                    }

                    <p>
                        <strong>Name:</strong>
                        ${escapeHtml(name)}
                    </p>

                    <p>
                        <strong>Email:</strong>
                        ${escapeHtml(email)}
                    </p>

                    ${
                        customer.CUSTOMER_ID
                        ?
                        `<p>
                            <strong>Customer ID:</strong>
                            ${escapeHtml(customer.CUSTOMER_ID)}
                        </p>`
                        :
                        ""
                    }

                </div>

            </div>

        `;


        console.log(
            "Customer:",
            customer
        );


    } catch (error) {

        console.error(
            "Ridhi Login Error:",
            error
        );


        result.innerHTML = `

            <div class="error">

                <strong>❌ Login Failed</strong>

                <p>
                    ${escapeHtml(error.message)}
                </p>

            </div>

        `;

    }

}


/* ============================================================
   BASIC HTML ESCAPE
   ============================================================ */

function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ============================================================
   START
   ============================================================ */

setupGoogleLogin();

</script>

</body>
</html>
